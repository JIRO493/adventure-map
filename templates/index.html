<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>冒険の地図</title>
    <meta name="viewport" content="width=device-width,initial-scale=1">
</head>
<body>
    <h1>冒険の地図</h1>

    <button id="gpsBtn">現在地を取得</button>

    <button id="clearBtn" disabled>制覇</button>
    <div id="map">
        {{map_html|safe}}
    </div>
    <div id="title"></div>

    <script>
        const gpsBtn=document.getElementById("gpsBtn");
        const clearBtn=document.getElementById("clearBtn");

        let currentSpot = null;
        
        gpsBtn.addEventListener("click",()=>{
            if(!navigator.geolocation){alert("GPSが使えません");
            return;
            }
        
        
            navigator.geolocation.getCurrentPosition(
                (pos)=>{
                 const lat=pos.coords.latitude;
                 const lon=pos.coords.longitude;
                 console.log("緯度：",lat,"経度：",lon,"精度(m):",pos.coords.accuracy
                );

                 fetch(`/check?lat=${lat}&lon=${lon}`)
                  .then(res=>res.json())
                  .then(data=>{
                    console.log(data);
            

                    const canClearSpot=data.spot.find(s=>s.can_clear);

                    if (canClearSpot){
                        clearBtn.disabled=false;
                        currentSpot=canClearSpot;
                    }else{
                        clearBtn.disabled=true;
                        currentSpot=null;
                    }
                  })
                  .catch(err=>console.error("fetch error:",err));
                }
            );
        });

    
    clearBtn.addEventListener("click",()=>{
        if (!currentSpot)return;

        const titleDiv=document.getElementById("title");
        titleDiv.innerHTML=`🏆${currentSpot.name}を制覇しました！`;
    });
    </script>
    
</body>
</html>
